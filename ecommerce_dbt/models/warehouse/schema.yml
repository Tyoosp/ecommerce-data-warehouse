version: 2

models:

  - name: dim_customer
    description: "Customer dimension containing one row per unique customer."
    columns:
      - name: customer_unique_id
        description: "Unique identifier for the customer."
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: "Product dimension containing product attributes."
    columns:
      - name: product_id
        description: "Unique identifier for the product."
        data_tests:
          - unique
          - not_null

  - name: dim_seller
    description: "Seller dimension containing seller attributes."
    columns:
      - name: seller_id
        description: "Unique identifier for the seller."
        data_tests:
          - unique
          - not_null

  - name: fact_orders
    description: "Order-level fact table containing one row per order."
    columns:
      - name: order_id
        description: "Unique identifier for the order."
        data_tests:
          - unique
          - not_null

  - name: fact_order_items
    description: "Order item-level fact table containing one row per order item."
    columns:
      - name: order_id
        description: "Identifier of the order."
        data_tests:
          - not_null
          - relationships:
              to: ref('fact_orders')
              field: order_id

      - name: order_item_id
        description: "Sequential item number within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Identifier of the product."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id

      - name: seller_id
        description: "Identifier of the seller."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_seller')
              field: seller_id

  - name: fact_payments
    description: "Order-level payment fact table containing aggregated payment information."
    columns:
      - name: order_id
        description: "Unique identifier of the order."
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('fact_orders')
              field: order_id
